[project]
name = "clinical-note-mcp"
version = "0.1.0"
description = "Turns free-text clinical notes into structured, evidence-linked data, exposed as an MCP server"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "mcp>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clinical-note-mcp = "notemcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
